<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ZolamAuth</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#050008;font-family:'Segoe UI',Arial,sans-serif;overflow:hidden;}
body{display:flex;align-items:center;justify-content:center;position:relative;}

#particles{position:fixed;inset:0;z-index:0;pointer-events:none;will-change:transform;}

.ambient{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 60% 50% at 50% 44%,rgba(160,60,255,0.09) 0%,transparent 65%),
    radial-gradient(ellipse 30% 25% at 20% 70%,rgba(120,30,220,0.05) 0%,transparent 60%),
    radial-gradient(ellipse 30% 25% at 80% 20%,rgba(200,100,255,0.04) 0%,transparent 60%);
  animation:ambPulse 6s ease-in-out infinite;
}
@keyframes ambPulse{0%,100%{opacity:0.7}50%{opacity:1}}

/* Scanline overlay */
.scanlines{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:repeating-linear-gradient(
    0deg,
    transparent,
    transparent 3px,
    rgba(0,0,0,0.07) 3px,
    rgba(0,0,0,0.07) 4px
  );
  animation:scanMove 8s linear infinite;
}
@keyframes scanMove{0%{background-position:0 0}100%{background-position:0 40px}}

.wrap{
  position:relative;z-index:3;text-align:center;
  width:88%;max-width:360px;padding:0 24px;
  display:flex;flex-direction:column;align-items:center;
  opacity:0;animation:wrapIn 0.9s cubic-bezier(0.16,1,0.3,1) 0.1s forwards;
}
@keyframes wrapIn{from{opacity:0;transform:translateY(32px) scale(0.94)}to{opacity:1;transform:none}}

.ring-wrap{
  width:172px;height:172px;margin-bottom:38px;
  position:relative;flex-shrink:0;
  opacity:0;animation:ringIn 1.1s cubic-bezier(0.16,1,0.3,1) 0.25s forwards;
}
@keyframes ringIn{from{opacity:0;transform:scale(0.35) rotate(-90deg)}to{opacity:1;transform:scale(1) rotate(0deg)}}

/* Pulse rings */
.pr{
  position:absolute;border-radius:50%;
  top:50%;left:50%;transform:translate(-50%,-50%);
}
.pr1{width:100%;height:100%;border:1px solid rgba(160,60,255,0.25);animation:prPulse 2.6s ease-out infinite;}
.pr2{width:132%;height:132%;border:1px solid rgba(160,60,255,0.10);animation:prPulse 2.6s ease-out 1.3s infinite;}
.pr3{width:165%;height:165%;border:1px solid rgba(160,60,255,0.04);animation:prPulse 2.6s ease-out 0.65s infinite;}
@keyframes prPulse{
  0%{transform:translate(-50%,-50%) scale(0.80);opacity:1}
  100%{transform:translate(-50%,-50%) scale(1.12);opacity:0}
}

/* Orbiting dot */
.orbit-dot{
  position:absolute;inset:0;
  animation:orbitSpin 3s linear infinite;
}
.orbit-dot::before{
  content:'';position:absolute;
  width:6px;height:6px;border-radius:50%;
  background:#c060ff;top:-3px;left:calc(50% - 3px);
  box-shadow:0 0 10px #c060ff,0 0 20px rgba(160,60,255,0.6);
}
.orbit-dot2{
  position:absolute;inset:12px;
  animation:orbitSpin 2s linear infinite reverse;
}
.orbit-dot2::before{
  content:'';position:absolute;
  width:4px;height:4px;border-radius:50%;
  background:#e080ff;top:-2px;left:calc(50% - 2px);
  box-shadow:0 0 7px #e080ff,0 0 14px rgba(200,80,255,0.5);
}
@keyframes orbitSpin{to{transform:rotate(360deg)}}

.arc{position:absolute;inset:0;border-radius:50%;border:2px solid transparent;will-change:transform;}

.arc1{
  border-top-color:#b040ff;
  border-right-color:rgba(160,60,255,0.10);
  animation:spin1 1.8s linear infinite, flickerP 4.5s ease-in-out infinite;
  filter:drop-shadow(0 0 8px #b040ff) drop-shadow(0 0 18px rgba(160,60,255,0.45));
}
@keyframes flickerP{
  0%,100%{filter:drop-shadow(0 0 8px #b040ff) drop-shadow(0 0 18px rgba(160,60,255,0.45));opacity:1}
  18%{filter:drop-shadow(0 0 2px #b040ff);opacity:0.55}
  20%{filter:drop-shadow(0 0 16px #b040ff) drop-shadow(0 0 32px rgba(160,60,255,0.65));opacity:1}
  55%{filter:drop-shadow(0 0 10px #b040ff) drop-shadow(0 0 22px rgba(160,60,255,0.5));opacity:1}
  57%{filter:drop-shadow(0 0 1px #b040ff);opacity:0.4}
  59%{filter:drop-shadow(0 0 14px #b040ff) drop-shadow(0 0 28px rgba(160,60,255,0.6));opacity:1}
}

.arc2{
  inset:14px;
  border-bottom-color:rgba(200,80,255,0.7);
  border-left-color:rgba(160,60,255,0.08);
  animation:spin2 1.2s linear infinite, flickerP2 6s ease-in-out 1.2s infinite;
  filter:drop-shadow(0 0 6px rgba(200,80,255,0.6));
}
@keyframes flickerP2{
  0%,100%{filter:drop-shadow(0 0 6px rgba(200,80,255,0.6));opacity:1}
  40%{filter:drop-shadow(0 0 1px rgba(200,80,255,0.2));opacity:0.5}
  42%{filter:drop-shadow(0 0 10px rgba(200,80,255,0.8));opacity:1}
}

.arc3{
  inset:28px;
  border-right-color:rgba(180,70,255,0.35);
  border-bottom-color:rgba(160,60,255,0.06);
  animation:spin3 2.6s linear infinite reverse;
  filter:drop-shadow(0 0 4px rgba(180,70,255,0.3));
}
.arc4{
  inset:5px;border-color:rgba(160,60,255,0.04);
  animation:breathe 4.5s ease-in-out infinite;
}

/* Hexagonal dashes */
.arc-hex{
  position:absolute;inset:0;border-radius:50%;
  border:1.5px dashed rgba(160,60,255,0.0);
  animation:hexAppear 3.8s ease-in-out infinite;
}
@keyframes hexAppear{
  0%,38%,100%{border-color:rgba(160,60,255,0.0);transform:rotate(0deg)}
  44%{border-color:rgba(160,60,255,0.4);transform:rotate(20deg)}
  50%{border-color:rgba(200,80,255,0.6);transform:rotate(36deg)}
  56%{border-color:rgba(160,60,255,0.3);transform:rotate(52deg)}
  62%{border-color:rgba(160,60,255,0.0);transform:rotate(68deg)}
}

@keyframes spin1{to{transform:rotate(360deg)}}
@keyframes spin2{to{transform:rotate(360deg)}}
@keyframes spin3{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{transform:scale(1);opacity:0.4}50%{transform:scale(1.09);opacity:1}}

/* Glow disc with purple tones */
.glow-disc{
  position:absolute;top:50%;left:50%;
  width:58%;height:58%;transform:translate(-50%,-50%);
  border-radius:50%;
  background:radial-gradient(circle,rgba(160,60,255,0.15) 0%,rgba(120,30,220,0.06) 50%,transparent 70%);
  animation:glowDisc 3.8s ease-in-out infinite;
}
@keyframes glowDisc{
  0%,100%{transform:translate(-50%,-50%) scale(1);opacity:0.7}
  50%{transform:translate(-50%,-50%) scale(1.18);opacity:1}
}

/* Energy burst on glow-disc - extra flair */
.energy-burst{
  position:absolute;top:50%;left:50%;
  width:30%;height:30%;transform:translate(-50%,-50%);
  border-radius:50%;
  background:radial-gradient(circle,rgba(200,100,255,0.4) 0%,transparent 70%);
  animation:energyPulse 2s ease-in-out infinite;
}
@keyframes energyPulse{
  0%,100%{transform:translate(-50%,-50%) scale(0.8);opacity:0.5}
  50%{transform:translate(-50%,-50%) scale(1.3);opacity:1}
}

.icon-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
.ic{
  width:34px;height:34px;fill:none;
  stroke:#c060ff;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round;
  animation:iconGlow 3s ease-in-out infinite, iconFlicker 5.5s ease-in-out 1s infinite;
}
@keyframes iconGlow{
  0%,100%{filter:drop-shadow(0 0 6px rgba(160,60,255,0.7));opacity:0.88}
  50%{filter:drop-shadow(0 0 16px rgba(200,80,255,1)) drop-shadow(0 0 28px rgba(160,60,255,0.55));opacity:1}
}
@keyframes iconFlicker{
  0%,100%{opacity:1}30%{opacity:0.65}32%{opacity:1}65%{opacity:0.6}67%{opacity:1}
}

/* ── GLITCH TITLE – purple ── */
.title{
  font-size:26px;font-weight:800;letter-spacing:-0.3px;
  color:#c060ff;min-height:34px;margin-bottom:10px;
  text-shadow:0 0 22px rgba(160,60,255,0.5),0 0 45px rgba(160,60,255,0.18);
  opacity:0;animation:slideUp 0.65s cubic-bezier(0.16,1,0.3,1) 0.45s forwards;
  position:relative;
}
.title.glitch-on{
  animation:slideUp 0.65s cubic-bezier(0.16,1,0.3,1) 0.45s forwards,
             glitchP 4s ease-in-out 1.5s infinite;
}
@keyframes glitchP{
  0%,75%,100%{
    text-shadow:0 0 22px rgba(160,60,255,0.5),0 0 45px rgba(160,60,255,0.18);
    transform:translate(0);
  }
  77%{
    text-shadow:-4px 0 rgba(0,200,255,0.9),4px 0 rgba(255,0,180,0.85),0 0 22px rgba(160,60,255,0.3);
    transform:translate(-3px,0) skewX(-3deg);
  }
  78%{
    text-shadow:4px 0 rgba(0,200,255,0.9),-4px 0 rgba(255,0,180,0.85);
    transform:translate(3px,0) skewX(3deg);
  }
  79%{
    text-shadow:-2px 0 rgba(0,200,255,0.5),2px 0 rgba(255,0,180,0.5);
    transform:translate(-1px,0);
  }
  80%{
    text-shadow:0 0 22px rgba(160,60,255,0.5);
    transform:translate(0);
  }
  84%{
    text-shadow:-5px 0 rgba(0,200,255,1),5px 0 rgba(255,0,180,1);
    transform:translate(-4px,1px) skewX(-5deg);
    filter:brightness(1.6);
  }
  85%{
    text-shadow:5px 0 rgba(0,200,255,1),-5px 0 rgba(255,0,180,1);
    transform:translate(4px,-1px) skewX(5deg);
    filter:brightness(1.6);
  }
  86%{
    text-shadow:0 0 22px rgba(160,60,255,0.5);
    transform:translate(0);filter:brightness(1);
  }
  89%{
    text-shadow:-3px 0 rgba(0,200,255,0.6),3px 0 rgba(255,0,180,0.5);
    transform:translate(-2px,0);
  }
  90%{
    text-shadow:0 0 22px rgba(160,60,255,0.5);
    transform:translate(0);
  }
}

.title.glitch-on::before,
.title.glitch-on::after{
  content:attr(data-text);
  position:absolute;top:0;left:0;width:100%;height:100%;
  color:#c060ff;
}
.title.glitch-on::before{
  animation:glitchTopP 4s ease-in-out 1.5s infinite;
  clip-path:polygon(0 0,100% 0,100% 38%,0 38%);
  left:-2px;
}
.title.glitch-on::after{
  animation:glitchBotP 4s ease-in-out 1.5s infinite;
  clip-path:polygon(0 62%,100% 62%,100% 100%,0 100%);
  left:2px;
}
@keyframes glitchTopP{
  0%,76%,82%,100%{transform:translate(0);opacity:0;}
  77%{transform:translate(-5px,0);opacity:1;filter:hue-rotate(200deg);}
  78%{transform:translate(5px,0);opacity:1;filter:hue-rotate(100deg);}
  79%{transform:translate(-2px,0);opacity:0.7;}
  80%{transform:translate(0);opacity:0;}
  83%{transform:translate(-7px,0);opacity:1;filter:hue-rotate(300deg);}
  84%{transform:translate(7px,0);opacity:1;}
  85%{transform:translate(0);opacity:0;}
}
@keyframes glitchBotP{
  0%,76%,82%,100%{transform:translate(0);opacity:0;}
  77%{transform:translate(5px,0);opacity:1;filter:hue-rotate(100deg);}
  78%{transform:translate(-5px,0);opacity:1;filter:hue-rotate(200deg);}
  79%{transform:translate(2px,0);opacity:0.7;}
  80%{transform:translate(0);opacity:0;}
  83%{transform:translate(7px,0);opacity:1;filter:hue-rotate(300deg);}
  84%{transform:translate(-7px,0);opacity:1;}
  85%{transform:translate(0);opacity:0;}
}

.subtitle{
  font-size:13px;color:rgba(220,180,255,0.32);
  line-height:1.95;font-weight:400;margin-bottom:28px;
  opacity:0;animation:slideUp 0.65s cubic-bezier(0.16,1,0.3,1) 0.58s forwards;
}
.divider{
  width:52px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(160,60,255,0.38),transparent);
  margin-bottom:26px;
  opacity:0;animation:fadeIn 0.5s ease 0.68s forwards;
}
@keyframes fadeIn{to{opacity:1}}

.footer{
  margin-top:24px;font-size:9px;font-weight:700;
  color:rgba(160,60,255,0.22);letter-spacing:3.5px;
  font-family:'Courier New',monospace;
  padding-top:14px;border-top:1px solid rgba(160,60,255,0.06);
  width:100%;
  opacity:0;animation:fadeIn 0.5s ease 0.88s forwards;
}
@keyframes slideUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<div class="ambient"></div>
<div class="scanlines"></div>
<canvas id="particles"></canvas>

<div class="wrap">
  <div class="ring-wrap">
    <div class="pr pr3"></div>
    <div class="pr pr2"></div>
    <div class="pr pr1"></div>
    <div class="arc arc4"></div>
    <div class="arc arc3"></div>
    <div class="arc arc2"></div>
    <div class="arc arc1"></div>
    <div class="arc-hex"></div>
    <div class="orbit-dot"></div>
    <div class="orbit-dot2"></div>
    <div class="glow-disc"></div>
    <div class="energy-burst"></div>
    <div class="icon-wrap" id="iconWrap"></div>
  </div>

  <div class="title" id="title"></div>
  <div class="subtitle" id="subtitle"></div>
  <div class="divider"></div>

  <div class="footer">— PROTECTED BY ZOLAM AUTH —</div>
</div>

<script>
// ── Particles ──
const canvas=document.getElementById('particles');
const ctx=canvas.getContext('2d');
let W,H,particles=[];

function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
resize();
window.addEventListener('resize',()=>{resize();initParticles();});

function initParticles(){
  particles=[];
  const count=Math.floor((W*H)/12000);
  for(let i=0;i<count;i++){
    // Mix of purple hues: 270–310 deg
    const hue=Math.floor(270+Math.random()*40);
    particles.push({
      x:Math.random()*W,
      y:Math.random()*H,
      r:Math.random()*1.6+0.4,
      vx:(Math.random()-0.5)*0.05,
      vy:-(Math.random()*0.07+0.015),
      alpha:Math.random()*0.4+0.06,
      phase:Math.random()*Math.PI*2,
      phaseSpeed:Math.random()*0.0022+0.0008,
      hue,
    });
  }
}
initParticles();

let lastTs=0;
function drawParticles(ts){
  const dt=Math.min(ts-lastTs,50);
  lastTs=ts;
  ctx.clearRect(0,0,W,H);
  for(const p of particles){
    p.x+=p.vx*dt;
    p.y+=p.vy*dt;
    p.phase+=p.phaseSpeed*dt;
    const a=p.alpha*(0.4+0.6*Math.sin(p.phase));
    if(p.y<-4)p.y=H+4;
    if(p.x<-4)p.x=W+4;
    if(p.x>W+4)p.x=-4;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=`hsla(${p.hue},100%,70%,${a.toFixed(3)})`;
    ctx.fill();
  }
  requestAnimationFrame(drawParticles);
}
requestAnimationFrame(drawParticles);

// ── Auth state ──
const params=new URLSearchParams(window.location.search);
const s=params.get('s')||'expired';

const iconSVGs={
  wifi:`<svg class="ic" viewBox="0 0 24 24"><line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.56 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>`,
  update:`<svg class="ic" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>`,
  lock:`<svg class="ic" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>`,
  key:`<svg class="ic" viewBox="0 0 24 24"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>`,
  x:`<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>`,
};

const cfg={
  offline:     {icon:'wifi',  title:'Server Offline',  sub:'The server is currently offline.<br>Please try again later.'},
  network:     {icon:'wifi',  title:'Network Error',   sub:'Please check your internet<br>connection and try again.'},
  tokenexpired:{icon:'update',title:'Update Required', sub:'Server requires a bypass update.<br>Contact your admin to proceed.'},
  expired:     {icon:'lock',  title:'Access Expired',  sub:'Your access has expired.<br>Please contact admin to renew.'},
  notfound:    {icon:'key',   title:'Not Registered',  sub:'Your device is not registered.<br>Contact admin to get access.'},
  error:       {icon:'x',     title:'Auth Failed',     sub:'Failed to verify your device.<br>Please restart the game.'},
};

const c=cfg[s]||cfg.error;
document.getElementById('iconWrap').innerHTML=iconSVGs[c.icon];
document.getElementById('subtitle').innerHTML=c.sub;

const titleEl=document.getElementById('title');
titleEl.setAttribute('data-text','');
setTimeout(()=>{
  let i=0;
  const type=()=>{
    if(i<c.title.length){
      titleEl.textContent+=c.title[i++];
      titleEl.setAttribute('data-text',titleEl.textContent);
      setTimeout(type,52);
    } else {
      titleEl.classList.add('glitch-on');
    }
  };
  type();
},480);
</script>
</body>
</html>
